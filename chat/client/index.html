<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reveal AI Chat</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: #f5f5f5;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
            background: white;
        }

        /* Chat Panel - Left Side */
        .chat-panel {
            flex: 0 0 45%;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #e5e5e5;
            background: white;
        }

        .chat-header {
            padding: 20px 24px;
            border-bottom: 1px solid #e5e5e5;
            background: white;
        }

        .chat-header h1 {
            font-size: 20px;
            font-weight: 600;
            color: #2d3748;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-header .logo {
            font-size: 24px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .chat-message {
            display: flex;
            gap: 12px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-avatar {
            flex-shrink: 0;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 600;
        }

        .user-avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .assistant-avatar {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .system-avatar {
            background: #e2e8f0;
            color: #4a5568;
            font-size: 14px;
        }

        .log-avatar {
            background: #bee3f8;
            color: #2c5282;
            font-size: 14px;
        }

        .error-avatar {
            background: #fed7d7;
            color: #c53030;
            font-size: 14px;
        }

        .message-content {
            flex: 1;
            min-width: 0;
        }

        .message-role {
            font-size: 12px;
            font-weight: 600;
            color: #718096;
            margin-bottom: 6px;
            text-transform: capitalize;
        }

        .message-text {
            color: #2d3748;
            line-height: 1.6;
            font-size: 15px;
        }

        .message-text.streaming {
            border-left: 3px solid #667eea;
            padding-left: 12px;
        }

        .message-text h1,
        .message-text h2,
        .message-text h3 {
            margin-top: 16px;
            margin-bottom: 8px;
            color: #1a202c;
        }

        .message-text h1 {
            font-size: 24px;
        }

        .message-text h2 {
            font-size: 20px;
        }

        .message-text h3 {
            font-size: 18px;
        }

        .message-text p {
            margin: 8px 0;
        }

        .message-text code {
            background: #f7fafc;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
            font-size: 14px;
            color: #e53e3e;
        }

        .message-text pre {
            background: #2d3748;
            color: #e2e8f0;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 12px 0;
        }

        .message-text pre code {
            background: none;
            padding: 0;
            color: #e2e8f0;
        }

        .message-text ul,
        .message-text ol {
            margin: 8px 0;
            padding-left: 24px;
        }

        .message-text li {
            margin: 4px 0;
        }

        .message-text blockquote {
            border-left: 4px solid #e2e8f0;
            padding-left: 16px;
            margin: 12px 0;
            color: #4a5568;
        }

        .message-text.system {
            color: #4a5568;
            font-style: italic;
        }

        .message-text.log {
            color: #2c5282;
            font-size: 13px;
        }

        .message-text.error {
            color: #c53030;
            background: #fff5f5;
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid #fc8181;
        }

        .chat-input-container {
            padding: 20px 24px;
            border-top: 1px solid #e5e5e5;
            background: white;
        }

        .chat-input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            resize: none;
            min-height: 50px;
            max-height: 200px;
            transition: border-color 0.2s;
        }

        .chat-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .chat-input::placeholder {
            color: #a0aec0;
        }

        .send-button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            white-space: nowrap;
        }

        .send-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .send-button:active {
            transform: translateY(0);
        }

        .send-button:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
            transform: none;
        }

        /* Dashboard Panel - Right Side */
        .dashboard-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fafafa;
            min-width: 0;
        }

        .dashboard-header {
            padding: 20px 24px;
            border-bottom: 1px solid #e5e5e5;
            background: white;
        }

        .dashboard-header h2 {
            font-size: 16px;
            font-weight: 600;
            color: #4a5568;
        }

        #revealView {
            flex: 1;
            width: 100%;
            background: white;
        }

        /* Empty state */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #a0aec0;
            text-align: center;
            padding: 40px;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 20px;
            margin-bottom: 8px;
            color: #718096;
        }

        .empty-state p {
            font-size: 14px;
            max-width: 400px;
        }

        /* Scrollbar styling */
        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: #f7fafc;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #cbd5e0;
            border-radius: 4px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #a0aec0;
        }
    </style>

</head>

<body>
    <div class="container">
        <!-- Chat Panel -->
        <div class="chat-panel">
            <div class="chat-header">
                <h1><span class="logo">💬</span> Reveal AI Chat</h1>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="empty-state">
                    <div class="empty-state-icon">🚀</div>
                    <h3>Start a conversation</h3>
                    <p>Ask questions about your data and I'll help you create insightful dashboards and visualizations.</p>
                </div>
            </div>
            <div class="chat-input-container">
                <div class="chat-input-wrapper">
                    <textarea id="chatInput" class="chat-input" placeholder="Ask me anything about your data..." rows="1"></textarea>
                    <button id="sendButton" class="send-button">Send</button>
                </div>
            </div>
        </div>

        <!-- Dashboard Panel -->
        <div class="dashboard-panel">
            <div class="dashboard-header">
                <h2>📊 Dashboard Viewer</h2>
            </div>
            <div id="revealView"></div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://unpkg.com/dayjs@1.8.21/dayjs.min.js"></script>
    <script src="https://dl.revealbi.io/reveal/libs/1.8.1/infragistics.reveal.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@revealbi/api@0.0.1-preview.1/dist/index.umd.min.js"></script>

    <script type="text/javascript">
        // Configure Reveal SDK
        $.ig.RevealSdkSettings.setBaseUrl("https://localhost:5111/");

        // Initialize Reveal SDK Client
        rv.RevealSdkClient.initialize({
            hostUrl: 'https://localhost:5111/'
        });

        const client = rv.RevealSdkClient.getInstance();
        let revealView;
        let streamedExplanation = '';

        // DOM Elements
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendButton = document.getElementById('sendButton');

        // Initialize RevealView
        function initializeDashboard() {
            revealView = new $.ig.RevealView("#revealView");
            revealView.canEdit = false;
            revealView.canSaveAs = false;
            revealView.showRefresh = false;
            revealView.canCopyVisualization = false;
        }

        initializeDashboard();

        // Add chat message to UI
        function addChatMessage(role, content) {
            // Remove empty state if present
            const emptyState = chatMessages.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = 'chat-message';

            const avatarDiv = document.createElement('div');
            avatarDiv.className = `message-avatar ${role}-avatar`;
            
            const avatarIcons = {
                user: '👤',
                assistant: '🤖',
                system: '⚙️',
                log: '📝',
                error: '⚠️'
            };
            avatarDiv.textContent = avatarIcons[role] || '💬';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';

            const roleDiv = document.createElement('div');
            roleDiv.className = 'message-role';
            roleDiv.textContent = role === 'assistant' ? 'AI Assistant' : role;

            const textDiv = document.createElement('div');
            textDiv.className = `message-text ${role}`;
            textDiv.innerHTML = content;

            contentDiv.appendChild(roleDiv);
            contentDiv.appendChild(textDiv);
            messageDiv.appendChild(avatarDiv);
            messageDiv.appendChild(contentDiv);
            chatMessages.appendChild(messageDiv);

            // Auto-scroll to bottom
            chatMessages.scrollTop = chatMessages.scrollHeight;

            return textDiv;
        }

        // Create streaming message placeholder
        function createStreamingMessage() {
            const textDiv = addChatMessage('assistant', '');
            textDiv.classList.add('streaming');
            return textDiv;
        }

        // Load dashboard from JSON response
        async function loadDashboardFromResponse(dashboardJson) {
            try {
                const json = JSON.parse(dashboardJson);
                revealView.dashboard = await $.ig.RevealUtility.createDashboardFromJsonObject(json);
                addChatMessage('system', '📊 Dashboard loaded successfully');
            } catch (e) {
                console.error('Failed to load dashboard:', e);
                addChatMessage('error', 'Failed to load dashboard: ' + e.message);
            }
        }

        // Handle send chat message
        async function handleSendChat() {
            if (!chatInput || !chatInput.value.trim()) return;

            const question = chatInput.value.trim();
            chatInput.value = '';
            chatInput.style.height = 'auto';

            // Disable send button during processing
            sendButton.disabled = true;

            addChatMessage('user', question);

            // Reset streamed explanation for new message
            streamedExplanation = '';
            let streamingMessageDiv = null;

            try {
                const response = await client.ai.chat.sendMessage(
                    {
                        question,
                        datasourceId: 'SampleExcel',
                        databaseId: 'SampleExcel',
                        dashboard: revealView.dashboard,
                        //streamExplanation: true
                    },
                    // {
                    //     onProgress: (message) => {
                    //         // Show progress messages as log entries
                    //         addChatMessage('log', message);
                    //     },
                    //     onTextChunk: (chunk) => {
                    //         // Handle streaming text chunks (like ChatGPT)
                    //         streamedExplanation += chunk;

                    //         // Create or update the streaming message div
                    //         if (!streamingMessageDiv) {
                    //             streamingMessageDiv = createStreamingMessage();
                    //         }
                    //         // Update the content with parsed markdown
                    //         streamingMessageDiv.innerHTML = marked.parse(streamedExplanation);
                    //         chatMessages.scrollTop = chatMessages.scrollHeight;
                    //     },
                    //     onError: (error, details) => {
                    //         console.error('Chat error:', error, details);
                    //         addChatMessage('error', error);
                    //     },
                    //     onComplete: (message, result) => {
                    //         console.log('Chat complete:', message);

                    //         // If we received streamed text, mark the streaming div as complete
                    //         if (streamingMessageDiv) {
                    //             streamingMessageDiv.classList.remove('streaming');
                    //             streamingMessageDiv.style.borderLeft = '3px solid #28a745';
                    //         }

                    //         // Load dashboard if included in the result
                    //         if (result?.dashboard) {
                    //             loadDashboardFromResponse(result.dashboard);
                    //         }
                    //     }
                    // }
                );

                // Handle case where no streaming occurred (fallback to final response)
                // if (!streamingMessageDiv && response.explanation) {
                //     const htmlContent = marked.parse(response.explanation);
                //     addChatMessage('assistant', htmlContent);
                // }

                // if (response.error) {
                //     addChatMessage('error', response.error);
                // }

                // // Load dashboard if present and not already loaded via onComplete
                // if (response.dashboard && !streamingMessageDiv) {
                //     await loadDashboardFromResponse(response.dashboard);
                // }
            } catch (error) {
            //addChatMessage('error', `Error: ${error.message}`);
            } finally {
                // Re-enable send button
                // sendButton.disabled = false;
                // chatInput.focus();
            }
        }

        // Event listeners
        sendButton.addEventListener('click', handleSendChat);

        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSendChat();
            }
        });

        // Auto-resize textarea
        chatInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 200) + 'px';
        });

        // Focus input on load
        chatInput.focus();
    </script>
</body>

</html>
